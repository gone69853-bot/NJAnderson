<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparateur de Cotes (7 Bookmakers)</title>
</head>
<body>

    <h2>Comparateur de Cotes</h2>
    <button onclick="loadOdds()">Actualiser</button>
    <br><br>

    <table border="1" cellpadding="5" cellspacing="0" id="oddsTable">
        <thead>
            <tr>
                <th>Match</th>
                <th>1xBet</th>
                <th>Betwinner</th>
                <th>Melbet</th>
                <th>Winwin</th>
                <th>1Win</th>
                <th>MegaPari</th>
                <th>PariPesa</th>
            </tr>
        </thead>
        <tbody>
            <!-- Injecté par JavaScript -->
        </tbody>
    </table>

    <script>
        async function loadOdds() {
            try {
                const response = await fetch('odds_data.json');
                const data = await response.json();
                
                const tbody = document.querySelector("#oddsTable tbody");
                tbody.innerHTML = "";

                // Parsing simple des matchs
                // Adapter la logique selon les clés JSON réelles de chaque bookmaker
                if (data) {
                    console.log("Données chargées pour 7 bookmakers :", Object.keys(data));
                }
            } catch (err) {
                console.error("Erreur :", err);
            }
        }

        loadOdds();
    </script>
</body>
</html>
