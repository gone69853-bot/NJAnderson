*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}a{color:inherit}:focus-visible{outline:3px solid rgba(37,99,235,.35);outline-offset:3px}@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
.topbar{position:relative;overflow:hidden;background:linear-gradient(135deg,#071b12 0%,#0b3322 55%,#11643a 100%);color:#fff}.topbar:before{content:"";position:absolute;width:420px;height:420px;right:-180px;top:-230px;border-radius:50%;background:rgba(250,204,21,.11)}.topbar:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 20%,rgba(255,255,255,.035) 20.5%,transparent 21%,transparent 48%,rgba(255,255,255,.025) 48.5%,transparent 49%);background-size:70px 70px;opacity:.7}.topbar__inner{position:relative;z-index:1;max-width:1120px;margin:auto;padding:18px 18px 24px}.hero-teaser{margin-top:24px;min-height:68px}.hero-teaser__match{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:15px;border-radius:16px;background:linear-gradient(135deg,#fff8d7,#facc15);color:#332600;box-shadow:0 16px 35px rgba(0,0,0,.2);animation:up .45s ease both}.hero-teaser__teams{font-size:clamp(16px,4vw,21px);font-weight:850;line-height:1.12;margin:0}.hero-teaser__odds{text-align:right;min-width:130px}.hero-teaser__market{display:block;font-size:11px;font-weight:700;opacity:.65}.hero-teaser__odds-value{display:block;font-family:var(--mono);font-size:30px;font-weight:900;line-height:1.05}.hero-teaser__odds-label{font-size:11px;opacity:.7}.hero-teaser__cta{margin-top:8px}.cta-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 15px;border-radius:11px;background:#111827;color:#fff;text-decoration:none;font-size:12px;font-weight:800;box-shadow:0 7px 15px rgba(0,0,0,.14);transition:.18s}.cta-button:hover{transform:translateY(-1px);background:#0b1220}.hero-teaser .cta-button{padding:8px 10px;font-size:10px;background:#0f172a}.hero-teaser .cta-button:hover{background:#111827}
.match{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}.market-group__title{display:flex;align-items:center;gap:7px;margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:850;color:#64748b}.market-group__title:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}.odds-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:13px;background:#fff}.odds-table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}.odds-table th,.odds-table td{padding:10px 8px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}.odds-table tbody tr:last-child th,.odds-table tbody tr:last-child td{border-bottom:0}.odds-table thead th{font-family:var(--font);font-size:10px;font-weight:750;color:#64748b;background:#f8fafc}.odds-table th[scope=row]{font-family:var(--font);font-weight:900;color:#334155;background:#f8fafc}.odds-table th[scope=row],.odds-table thead th:first-child{position:sticky;left:0;z-index:2;min-width:42px}.odds-table td{min-width:65px;font-weight:650;color:#334155}.odds-table td.best{position:relative;background:linear-gradient(135deg,#fef3c7,#facc15);color:#3b2a00;font-weight:950;box-shadow:inset 0 0 0 1px #eab308}.odds-table td.best:after{content:"BEST";display:block;font-family:var(--font);font-size:7px;line-height:1;color:#8a5b00;margin-top:2px;font-weight:900}.single-odds__source{font-size:11px;color:var(--muted);margin:0 0 8px}.single-odds{display:flex;flex-wrap:wrap;gap:7px}.single-odds__chip{display:flex;align-items:center;gap:8px;background:var(--green-soft);border:1px solid #bbf7d0;color:#166534;border-radius:11px;padding:8px 10px;font-family:var(--mono);font-size:13px;font-weight:850}.single-odds__label{font-family:var(--font);font-size:10px;font-weight:800;color:#15803d}.book-link{text-decoration:none;color:inherit;border-bottom:1px dotted #94a3b8}.book-link:hover{color:var(--green-dark);border-bottom-style:solid}
.site-footer{max-width:1120px;margin:auto;padding:22px 18px 50px;color:#94a3b8;font-size:11px;text-align:center}.site-footer p{margin:0 auto;max-width:820px}.site-footer strong{color:#64748b}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.crumb{padding:10px 0;font-size:12.5px;font-weight:700}.crumb a{color:#c7dfd1;text-decoration:none;display:inline-flex;align-items:center;gap:6px}.crumb a:hover{color:#fff}.crumb svg{width:13px;height:13px}
.vs-hero{max-width:760px;padding:6px 0 22px;text-align:center}.vs-hero__teams{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}.vs-hero__team{font-size:clamp(20px,5vw,32px);font-weight:900;letter-spacing:-.03em;max-width:15ch}.vs-hero__vs{font-size:13px;font-weight:800;color:#c7dfd1;opacity:.75;padding:4px 10px;border:1px solid rgba(255,255,255,.2);border-radius:999px}
.fiche-main{max-width:760px;margin:0 auto;padding:22px 18px 40px;display:flex;flex-direction:column;gap:16px}
.share-fab{position:fixed;right:16px;bottom:16px;z-index:30;display:flex;align-items:center;gap:8px;padding:12px 16px;background:#111827;color:#fff;border:none;border-radius:999px;font-family:var(--font);font-weight:800;font-size:12.5px;box-shadow:0 10px 22px rgba(0,0,0,.3);cursor:pointer}.share-fab svg{width:15px;height:15px}
.share-toast{position:fixed;right:16px;bottom:64px;z-index:30;background:#111827;color:#fff;font-size:12px;padding:8px 12px;border-radius:8px;opacity:0;transform:translateY(6px);pointer-events:none;transition:.2s}.share-toast.is-visible{opacity:1;transform:translateY(0)}
@media(max-width:520px){.fiche-main{padding:16px 14px 35px}}

<body>

<header class="topbar">
  <div class="topbar__inner">
    <p class="crumb">
      <a href="../">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>

    <section class="vs-hero">

</header>

</footer>

<button class="share-fab" id="shareBtn" type="button">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>
  Partager
</button>
<div class="share-toast" id="shareToast">Lien copié</div>

<script id="match-data" type="application/json">{"equipe_1": "Whitecaps ", "equipe_2": "Timber ", "bookmakers": ["betwinner", "melbet", "megapari", "1xbet"], "marches": [{"marche": "V1", "valeurs": {"betwinner": 2.2, "melbet": 2.2, "megapari": 2.2, "1xbet": 2.2}, "meilleur_site": "betwinner", "meilleure_cote": 2.2}, {"marche": "X", "valeurs": {"betwinner": 3.11, "melbet": 3.11, "megapari": 3.11, "1xbet": 3.11}, "meilleur_site": "betwinner", "meilleure_cote": 3.11}, {"marche": "V2", "valeurs": {"betwinner": 2.39, "melbet": 2.39, "megapari": 2.39, "1xbet": 2.39}, "meilleur_site": "betwinner", "meilleure_cote": 2.39}, {"marche": "Plus de", "valeurs": {"betwinner": 1.91, "1xbet": 1.91}, "meilleur_site": "betwinner", "meilleure_cote": 1.91}, {"marche": "Moins de", "valeurs": {"betwinner": 1.76, "1xbet": 1.76}, "meilleur_site": "betwinner", "meilleure_cote": 1.76}]}</script>
<script>

const NAMES = {
    betwinner: "Betwinner", melbet: "MelBet", megapari: "MegaPari",
    "1win": "1win", winwin: "WinWin", "1xbet": "1xBet", paripesa: "Paripesa",
    "africa-bizbet": "Africa BizBet"
};

const AFFILIATE_LINKS = {
    betwinner: "https://bw-prm.com/wc-2026-200-lite/?s1=Zicote.site&p=%2Fregistration%2F&id=38NP",
    melbet: "https://refpa3665.com/L?tag=d_6076923m_66329c_&site=6076923&ad=66329",
    megapari: null,
    "1win": "https://1win.com/betting?p=mvh5&sharebet=Zicote",
    winwin: "https://refpa49781.com/L?tag=d_6076846m_94904c_&site=6076846&ad=94904",
    "1xbet": "https://reffpa.com/L?tag=d_6076956m_1599c_&site=6076956&ad=1599",
    paripesa: null,
    "africa-bizbet": null
};

const ROW_LABELS = { V1: "1", X: "X", V2: "2", "Plus de": "+2,5", "Moins de": "-2,5" };

const MARKET_GROUPS = [
    { title: "Résultat (1X2)", keys: ["V1", "X", "V2"] },
    { title: "Total buts (2,5)", keys: ["Plus de", "Moins de"] }
];

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    }[c]));
}

function marketLabel(match, market) {
    switch (market.marche) {
        case "V1": return "Victoire " + match.equipe_1;
        case "V2": return "Victoire " + match.equipe_2;
        case "X": return "Match nul";
        case "Plus de": return "Plus de 2,5 buts";
        case "Moins de": return "Moins de 2,5 buts";
        default: return market.marche;
    }
}

function bestOverall(match) {
    let best = null;
    for (const m of match.marches) {
        if (AFFILIATE_LINKS[m.meilleur_site] && (!best || m.meilleure_cote > best.meilleure_cote)) {
            best = m;
        }
    }
    if (!best) {
        for (const m of match.marches) {
            if (!best || m.meilleure_cote > best.meilleure_cote) best = m;
        }
    }
    return best;
}

function renderSpotlight(match) {
    const el = document.getElementById("spotlight");
    const best = bestOverall(match);

    if (!best) {
        el.innerHTML = "";
        return;
    }

    const link = AFFILIATE_LINKS[best.meilleur_site];

    const cta = link
        ? `<a class="cta-button" href="${link}" target="_blank" rel="noopener sponsored">S'inscrire sur ${escapeHTML(NAMES[best.meilleur_site] || best.meilleur_site)}</a>`
        : "";

    el.innerHTML = `
        <div class="hero-teaser__match">
            <p class="hero-teaser__teams">${escapeHTML(marketLabel(match, best))}</p>
            <div class="hero-teaser__odds">
                <span class="hero-teaser__market">Meilleure cote</span>
                <span class="hero-teaser__odds-value">${best.meilleure_cote}</span>
                <span class="hero-teaser__odds-label">chez ${escapeHTML(NAMES[best.meilleur_site] || best.meilleur_site)}</span>
                <div class="hero-teaser__cta">${cta}</div>
            </div>
        </div>
    `;
}

function ratesAreIdentical(rows, columns) {
    if (columns.length < 2) {
        return false;
    }
    return rows.every(market => {
        const values = columns.map(b => market.valeurs[b]);
        return values.every(v => Math.abs(v - values[0]) < 0.005);
    });
}

function renderChips(rows, bookmaker) {
    return rows.map(market => `
        <div class="single-odds__chip">
            <span class="single-odds__label">${escapeHTML(ROW_LABELS[market.marche] || market.marche)}</span>
            <span class="single-odds__value">${market.valeurs[bookmaker]}</span>
        </div>
    `).join("");
}

function renderMarketGroup(match, group) {

    const rows = match.marches.filter(m => group.keys.includes(m.marche));
    if (!rows.length) {
        return "";
    }

    const columns = (match.bookmakers || []).filter(
        b => rows.every(m => m.valeurs[b] !== undefined)
    );
    if (!columns.length) {
        return "";
    }

    if (columns.length === 1) {

        const b = columns[0];
        const link = AFFILIATE_LINKS[b];
        const label = escapeHTML(NAMES[b] || b);
        const nameMarkup = link
            ? `<a class="book-link" href="${link}" target="_blank" rel="noopener sponsored">${label}</a>`
            : label;

        return `
            <div class="match">
                <p class="market-group__title">${escapeHTML(group.title)}</p>
                <p class="single-odds__source">Meilleure cote chez ${nameMarkup}</p>
                <div class="single-odds">${renderChips(rows, b)}</div>
            </div>
        `;
    }

    if (ratesAreIdentical(rows, columns)) {

        const linked = columns.find(b => AFFILIATE_LINKS[b]);
        const link = linked ? AFFILIATE_LINKS[linked] : null;
        const namesList = columns.map(b => NAMES[b] || b).join(", ");
        const nameMarkup = link
            ? `<a class="book-link" href="${link}" target="_blank" rel="noopener sponsored">${escapeHTML(namesList)}</a>`
            : escapeHTML(namesList);

        return `
            <div class="match">
                <p class="market-group__title">${escapeHTML(group.title)}</p>
                <p class="single-odds__source">Cote identique chez ${nameMarkup}</p>
                <div class="single-odds">${renderChips(rows, columns[0])}</div>
            </div>
        `;
    }

    const headerCells = columns.map(b => {
        const link = AFFILIATE_LINKS[b];
        const label = escapeHTML(NAMES[b] || b);
        return link
            ? `<th><a class="book-link" href="${link}" target="_blank" rel="noopener sponsored">${label}</a></th>`
            : `<th>${label}</th>`;
    }).join("");

    const bodyRows = rows.map(market => {
        const cells = columns.map(b => {
            const value = market.valeurs[b];
            const isBest = b === market.meilleur_site;
            return `<td class="${isBest ? "best" : ""}">${value}</td>`;
        }).join("");
        return `
            <tr>
                <th scope="row">${escapeHTML(ROW_LABELS[market.marche] || market.marche)}</th>
                ${cells}
            </tr>
        `;
    }).join("");

    return `
        <div class="match">
            <p class="market-group__title">${escapeHTML(group.title)}</p>
            <div class="odds-scroll">
                <table class="odds-table">
                    <thead><tr><th></th>${headerCells}</tr></thead>
                    <tbody>${bodyRows}</tbody>
                </table>
            </div>
        </div>
    `;
}

function render(match) {

    document.getElementById("teamLeft").textContent = match.equipe_1;
    document.getElementById("teamRight").textContent = match.equipe_2;

    renderSpotlight(match);

    document.getElementById("marketCards").innerHTML = MARKET_GROUPS
        .map(group => renderMarketGroup(match, group))
        .join("");
}

function setupShare(match) {

    const btn = document.getElementById("shareBtn");
    const toast = document.getElementById("shareToast");

    btn.addEventListener("click", async () => {

        const url = window.location.href;
        const title = `${match.equipe_1} – ${match.equipe_2} · Cotes en direct`;

        if (navigator.share) {
            try {
                await navigator.share({ title, url });
                return;
            } catch (e) { /* annulé */ }
        }

        try {
            await navigator.clipboard.writeText(url);
        } catch (e) { /* indisponible */ }

        toast.classList.add("is-visible");
        setTimeout(() => toast.classList.remove("is-visible"), 1800);
    });
}

const match = JSON.parse(document.getElementById("match-data").textContent);
render(match);
setupShare(match);

</script>
</body>
