name: Zicote - Update Odds

on:
  schedule:
    # Toutes les heures
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Installer Chromium
        run: |
          playwright install --with-deps chromium

      - name: Récupérer les matchs et les cotes
        env:
          PROXY_SERVER: "http://p.webshare.io:80"
          PROXY_USERNAME: "kecsytba-rotate"
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}

          MAX_MATCHES_PER_SITE: "50"

        run: |
          python scraper.py

      - name: Construire le comparateur
        run: |
          python comparateur.py

      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "zicote-bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            betwinner.json \
            melbet.json \
            megapari.json \
            1win.json \
            winwin.json \
            1xbet.json \
            paripesa.json

          git add -A docs/

          if git diff --cached --quiet; then
            echo "Aucune modification."
            exit 0
          fi

          git commit -m "Update odds"

          # Le scraping peut durer longtemps : si quelqu'un a modifié
          # le dépôt pendant ce temps (ex. edit manuel sur GitHub),
          # on récupère ces changements avant de pousser, au lieu de
          # se faire rejeter.
          git fetch origin main

          if ! git rebase origin/main; then
            echo "Conflit lors du rebase, abandon."
            git rebase --abort
            exit 1
          fi

          git pushgit push
          fi
