name: Zicote - Update Odds

on:
  schedule:
    # Toutes les 45 minutes
    # 0h00, 0h45, 1h30, 2h15, 3h00, 3h45, 4h30, 5h15, ...
    - cron: "0 0,3,6,9,12,15,18,21 * * *"
    - cron: "45 0,3,6,9,12,15,18,21 * * *"
    - cron: "30 1,4,7,10,13,16,19,22 * * *"
    - cron: "15 2,5,8,11,14,17,20,23 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Installer Chromium
        run: |
          playwright install --with-deps chromium

      - name: Récupérer les matchs et les cotes
        env:
          PROXY_SERVER: "http://p.webshare.io:80"
          PROXY_USERNAME: "kecsytba-rotate"
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}

          MAX_MATCHES_PER_SITE: "50"

        run: |
          python scraper.py

      - name: Construire le comparateur
        run: |
          python comparateur.py

      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "zicote-bot"
          git config user.email "actions@users.noreply.github.com"

          # Fichiers JSON des bookmakers
          git add \
            betwinner.json \
            melbet.json \
            megapari.json \
            1win.json \
            winwin.json \
            1xbet.json \
            paripesa.json \
            africa-bizbet.json \
            comparison.json

          # Pages et données du comparateur
          git add -A docs/

          # Fichiers de diagnostic.
          # Le glob peut ne rien trouver : on ignore alors l'erreur.
          git add debug_*.html debug_*.txt debug_*.json 2>/dev/null || true

          # Vérifier s'il y a réellement quelque chose à publier
          if git diff --cached --quiet; then
            echo "Aucune modification."
            exit 0
          fi

          git commit -m "Update odds"

          # Récupérer les éventuelles modifications poussées
          # par un autre run pendant le scraping.
          git fetch origin main

          # En cas de conflit sur les fichiers générés,
          # conserver notre version issue du scraping actuel.
          if ! git merge -X ours --no-edit origin/main; then
            echo "Conflit non résolu automatiquement, abandon."
            git merge --abort
            exit 1
          fi

          git push
