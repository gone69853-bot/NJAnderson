name: Zicote - Update Odds

on:
  schedule:
    # Filet de sécurité : relance la chaîne si elle s'est arrêtée
    - cron: "0 */3 * * *"
  workflow_dispatch:

# Un seul run à la fois. Le nouveau attend son tour au lieu
# d'annuler celui en cours (cancel-in-progress: false).
concurrency:
  group: zicote-update-odds
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Installer Chromium
        run: |
          playwright install --with-deps chromium

      - name: Récupérer les matchs et les cotes
        env:
          PROXY_SERVER: "http://p.webshare.io:80"
          PROXY_USERNAME: "kecsytba-rotate"
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          MAX_MATCHES_PER_SITE: "50"
        run: |
          python scraper.py

      - name: Construire le comparateur
        run: |
          python comparateur.py

      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "zicote-bot"
          git config user.email "actions@users.noreply.github.com"

          # Fichiers JSON des bookmakers
          git add \
            betwinner.json \
            melbet.json \
            megapari.json \
            1win.json \
            winwin.json \
            1xbet.json \
            africa-bizbet.json \
            comparison.json

          # Pages et données du comparateur
          git add -A docs/

          # Fichiers de diagnostic (le glob peut ne rien trouver)
          git add debug_*.html debug_*.txt debug_*.json 2>/dev/null || true

          # Rien à publier ?
          if git diff --cached --quiet; then
            echo "Aucune modification."
            exit 0
          fi

          git commit -m "Update odds"

          # Contenu régénéré à chaque run : le plus récent
          # remplace toujours l'ancien, pas de fusion.
          git fetch origin main
          git push --force-with-lease origin HEAD:main

  relaunch:
    needs: update
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Pause puis relancer le workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 300
          gh workflow run "${{ github.workflow }}" \
            --repo "${{ github.repository }}" --ref main
